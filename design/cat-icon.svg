<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
  </defs>

  <!-- 长尾巴:从身体右下弯曲到左上 -->
  <path d="M 145 155
           C 175 160, 190 140, 185 115
           C 182 100, 170 92, 158 96
           C 150 99, 148 108, 152 115
           C 155 120, 162 118, 163 112"
        fill="none" stroke="url(#body)" stroke-width="14" stroke-linecap="round"/>

  <!-- 身体 -->
  <ellipse cx="100" cy="135" rx="52" ry="38" fill="url(#body)"/>

  <!-- 头 -->
  <ellipse cx="100" cy="78" rx="46" ry="40" fill="url(#body)"/>

  <!-- 左耳 -->
  <path d="M 62 58 L 54 22 L 88 44 Z" fill="url(#body)"/>
  <path d="M 66 52 L 61 32 L 80 46 Z" fill="#ff6b9d" opacity="0.6"/>

  <!-- 右耳 -->
  <path d="M 138 58 L 146 22 L 112 44 Z" fill="url(#body)"/>
  <path d="M 134 52 L 139 32 L 120 46 Z" fill="#ff6b9d" opacity="0.6"/>

  <!-- 眼睛 -->
  <ellipse cx="82" cy="76" rx="8" ry="11" fill="url(#eye)"/>
  <ellipse cx="118" cy="76" rx="8" ry="11" fill="url(#eye)"/>
  <circle cx="84" cy="72" r="2.5" fill="#fff"/>
  <circle cx="120" cy="72" r="2.5" fill="#fff"/>

  <!-- 鼻子+嘴 -->
  <path d="M 96 92 L 104 92 L 100 97 Z" fill="#ff6b9d"/>
  <path d="M 100 97 Q 100 103, 92 104" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 100 97 Q 100 103, 108 104" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 胡须 -->
  <line x1="60" y1="88" x2="36" y2="84" stroke="#666" stroke-width="1.2"/>
  <line x1="60" y1="92" x2="36" y2="94" stroke="#666" stroke-width="1.2"/>
  <line x1="140" y1="88" x2="164" y2="84" stroke="#666" stroke-width="1.2"/>
  <line x1="140" y1="92" x2="164" y2="94" stroke="#666" stroke-width="1.2"/>

  <!-- 额头斑纹 -->
  <line x1="96" y1="44" x2="96" y2="54" stroke="#454555" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="44" x2="104" y2="54" stroke="#454555" stroke-width="2" stroke-linecap="round"/>

  <!-- 胸前白毛 -->
  <ellipse cx="100" cy="142" rx="24" ry="18" fill="#3a3b4a" opacity="0.5"/>

  <!-- 尾巴尖白色 -->
  <circle cx="152" cy="115" r="7" fill="#3a3b4a"/>
</svg>
