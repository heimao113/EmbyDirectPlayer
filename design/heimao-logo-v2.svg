<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" width="460" height="130">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b9d" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff6b9d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff6b9d" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="460" height="130" rx="16" fill="url(#bgg)"/>

  <!-- ====== 文字 heimao の emby ====== -->
  <text x="24" y="86" font-family="'Arial Black','Noto Sans SC',sans-serif" font-size="58" font-weight="900" fill="#e8eaef" letter-spacing="-1">heimao</text>
  <text x="240" y="86" font-family="'Noto Sans SC','Yu Gothic','Hiragino Sans',sans-serif" font-size="50" font-weight="700" fill="#ff6b9d">の</text>
  <text x="298" y="86" font-family="'Arial Black','Noto Sans SC',sans-serif" font-size="58" font-weight="900" fill="#e8eaef" letter-spacing="-1">emby</text>

  <!-- ====== 黑猫:攀附在 h 上,尾巴延伸到 emby 的 o ====== -->

  <!-- h 字母上的猫耳:两个小三角,只比文字突出一点点 -->
  <path d="M 28 26 L 24 14 L 36 22 Z" fill="#1a1a25" opacity="0.9"/>
  <path d="M 44 28 L 48 16 L 36 24 Z" fill="#1a1a25" opacity="0.9"/>

  <!-- 猫眼:两个微光绿点,藏在 h 的顶部 -->
  <circle cx="30" cy="22" r="2" fill="#4ade80" opacity="0.5"/>
  <circle cx="40" cy="22" r="2" fill="#4ade80" opacity="0.5"/>

  <!-- ====== 尾巴:从 h 底部沿文字下沿流过,卷到 emby 的 o ====== -->
  <!-- 用粉色半透明弧线,细→粗→细,优雅的猫尾巴弧线 -->
  <path d="M 20 92
           C 60 100, 120 104, 180 100
           C 240 96, 300 94, 350 96
           C 380 97, 400 100, 412 94
           C 420 90, 418 82, 410 80
           C 404 79, 400 83, 402 88"
        fill="none" stroke="url(#tail)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- 尾巴尖:一个小三角 -->
  <path d="M 402 88 L 406 80 L 396 84 Z" fill="#ff6b9d" opacity="0.3"/>

  <!-- ====== 猫耳内部的粉色点缀 ====== -->
  <path d="M 30 20 L 28 16 L 34 19 Z" fill="#ff6b9d" opacity="0.3"/>
  <path d="M 43 24 L 45 21 L 39 22 Z" fill="#ff6b9d" opacity="0.3"/>

</svg>
